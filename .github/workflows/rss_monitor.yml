name: RSS Feed Monitor

on:
  schedule:
    - cron: '*/10 * * * *'   # backup only — GitHub cron is best-effort
  workflow_dispatch:          # allows manual + external-cron triggering

permissions:
  contents: write

jobs:
  check-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RSS Feed Monitor
        env:
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEBHOOK_TYPEII_EN: ${{ secrets.WEBHOOK_TYPEII_EN }}
          WEBHOOK_POMPOM_HONKAISR: ${{ secrets.WEBHOOK_POMPOM_HONKAISR }}
          WEBHOOK_WUTHERING_WAVES: ${{ secrets.WEBHOOK_WUTHERING_WAVES }}
          WEBHOOK_HONKAINA: ${{ secrets.WEBHOOK_HONKAINA }}
          WEBHOOK_ANANTA_EN: ${{ secrets.WEBHOOK_ANANTA_EN }}
        # ───────────────────────────────────────────────────────────────────
        # TESTING AREA (how updates ship):
        # • A new/changed script lives in "testing area/" FIRST (e.g.
        #   main_v3test.py). Point this line at the test copy — THE QUOTES
        #   ARE REQUIRED (the folder name contains a space):
        #       run: python "testing area/main_v3test.py"
        # • Check BOTH the Discord post(s) AND this workflow's log.
        # • Once the test copy passes, copy it over the production file and
        #   point this line back:
        #       run: python main.py       <- V1 (plain, no API key)
        #       run: python main_v2.py    <- V2 (card, buttons outside)
        #       run: python main_v3.py    <- V3 (card, buttons nested)
        # ───────────────────────────────────────────────────────────────────
        run: python "testing area/main_v3testpro.py"   # ← switch to main.py / main_v2.py here

      - name: Commit and push updated posted_tweets.json cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f posted_tweets.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update posted_tweets.json cache" && git push)
